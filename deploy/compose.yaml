# ────────────────────────────────────────────────────────────────
# Kwatro — stack Docker LOCALE
#
#   pnpm db:up        → profil « db » : PostgreSQL/PostGIS + Mailpit (l'API et le site tournent avec `pnpm dev`)
#   pnpm docker:up    → profils db + backend + frontend : tout en conteneurs, images de production
#   pnpm db:down / pnpm docker:down
#
# Équivalent sans pnpm, depuis ce dossier : docker compose --profile db up -d
# Production : voir dokploy/docker-compose.dokploy.yml
# ────────────────────────────────────────────────────────────────
name: kwatro

networks:
  # Réseau privé api <-> postgres
  kwatro-internal:
    name: kwatro-internal

services:
  postgres:
    container_name: kwatro-postgres
    # Image multi-architecture (Mac Apple Silicon + x86) ; postgis/postgis n'existe qu'en amd64
    image: imresamu/postgis:17-3.5
    profiles: [db]
    restart: unless-stopped
    environment:
      POSTGRES_USER: kwatro
      POSTGRES_PASSWORD: kwatro
      POSTGRES_DB: kwatro
    # Port de l'hôte modifiable si déjà pris : POSTGRES_PORT=5470 pnpm db:up
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5469}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kwatro-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kwatro -d kwatro"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    container_name: kwatro-mailpit
    # Boîte mail de test : http://localhost:8025 (SMTP sur le port 1025)
    image: axllent/mailpit:latest
    profiles: [db]
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - kwatro-internal

  api:
    container_name: kwatro-api
    profiles: [backend]
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://kwatro:kwatro@postgres:5432/kwatro?schema=public
      CORS_ORIGINS: http://localhost:3001,http://localhost:8081
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - kwatro-internal
    depends_on:
      postgres:
        condition: service_healthy

  web:
    container_name: kwatro-web
    profiles: [frontend]
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  postgres-data:
