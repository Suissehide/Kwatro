name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://lucko:lucko@localhost:5432/lucko?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome (lint + format)
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build API + site
        run: pnpm turbo run build --filter=@lucko/api --filter=@lucko/web

      - name: Client API à jour avec l'OpenAPI
        run: |
          pnpm api:generate
          git diff --exit-code packages/api-client || { echo "Client API périmé : lance 'pnpm api:generate' et committe le résultat"; exit 1; }
