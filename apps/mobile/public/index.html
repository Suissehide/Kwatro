<!DOCTYPE html>
<!-- Gabarit web de l'app : celui d'Expo (@expo/cli/static/template/index.html) + favicon -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Même favicon que le site (apps/web/src/app/icon.svg) -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Focus « Plateau pop », comme le site (kwatro.css) : rien au clic souris, anneau encre + halo
         jaune au clavier, à la place du rectangle bleu du navigateur */
      :focus:not(:focus-visible) {
        outline: none;
      }
      :focus-visible {
        outline: 3px solid #16130f;
        outline-offset: 2px;
        box-shadow: 0 0 0 7px #f5b800;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
