# ────────────────────────────────────────────────────────────────
# Kwatro — déploiement avec Dokploy (type « Docker Compose »)
#
# Dans Dokploy : Create Service › Compose › dépôt GitHub Suissehide/Kwatro,
#   Compose Path = ./docker-compose.dokploy.yml
#   Environment  = les variables de .env.dokploy.example (vraies valeurs)
#
# Routage : labels Traefik ci-dessous (domaines + HTTPS).
# Si tu préfères déclarer les domaines dans l'onglet « Domains » de Dokploy,
# supprime les labels `traefik.*` : Dokploy les ajoute lui-même.
# ────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kwatro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:-kwatro}
    volumes:
      # Volume nommé : sauvegardable depuis Dokploy (Volume Backups) ou par pg_dump
      - kwatro-postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kwatro} -d ${POSTGRES_DB:-kwatro}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-kwatro}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kwatro}?schema=public
      CORS_ORIGINS: https://${WEB_DOMAIN:?WEB_DOMAIN manquant}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      - traefik.http.routers.kwatro-api.rule=Host(`${API_DOMAIN:?API_DOMAIN manquant}`)
      - traefik.http.routers.kwatro-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.kwatro-api.tls=true
      - traefik.http.routers.kwatro-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.kwatro-api.loadbalancer.server.port=3000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      - traefik.http.routers.kwatro-web.rule=Host(`${WEB_DOMAIN}`)
      - traefik.http.routers.kwatro-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.kwatro-web.tls=true
      - traefik.http.routers.kwatro-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.kwatro-web.loadbalancer.server.port=3000

networks:
  # Réseau privé : la base n'est jamais exposée au proxy ni à Internet
  internal:
  # Réseau partagé avec Traefik (dokploy-network par défaut)
  proxy:
    name: ${TRAEFIK_NETWORK:-dokploy-network}
    external: true

volumes:
  kwatro-postgres-data:
